<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskNode - Terreno</title>
    <!-- Tailwind CSS para diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-xl font-bold text-center">TaskNode App</h1>
        <p class="text-xs text-center text-blue-200">Panel de Técnico en Terreno</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full">
        <div class="bg-white rounded-lg shadow-sm p-5">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2">Nuevo Reporte</h2>
            
            <form id="reportForm" class="space-y-4">
                
                <!-- Faena -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de la Faena</label>
                    <input type="text" id="faena_nombre" required placeholder="Ej: Planta Sur" 
                           class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <!-- Estado (Semáforo) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Estado Operativo</label>
                    <select id="estado" required onchange="toggleMotivo()"
                            class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="" disabled selected>Seleccione un estado...</option>
                        <option value="VERDE">🟢 Normal (Sin problemas)</option>
                        <option value="AMARILLO">🟡 Advertencia (Operando con lentitud)</option>
                        <option value="ROJO">🔴 Crítico (Operación detenida)</option>
                    </select>
                </div>

                <!-- Motivo de Bloqueo (Oculto por defecto, se muestra si es Amarillo o Rojo) -->
                <div id="div_motivo" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Motivo del problema</label>
                    <select id="motivo_bloqueo" class="w-full border border-gray-300 rounded-md p-2">
                        <option value="Falla Eléctrica">Falla Eléctrica</option>
                        <option value="Falla Mecánica">Falla Mecánica</option>
                        <option value="Falta de Insumos">Falta de Insumos</option>
                        <option value="Otros">Otros (Especificar en notas)</option>
                    </select>
                </div>

                <!-- Notas libres (Lo que me pediste antes) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notas adicionales (Opcional)</label>
                    <textarea id="notas" rows="3" placeholder="Detalles del reporte o justificación de 'Otros'..."
                              class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>

                <!-- GPS Status -->
                <div class="text-xs text-gray-500 flex items-center justify-between bg-gray-50 p-2 rounded">
                    <span>📍 Ubicación GPS:</span>
                    <span id="gps_status" class="font-mono text-blue-600">Buscando...</span>
                </div>

                <!-- Submit -->
                <button type="submit" id="btn_submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition-colors duration-200">
                    Enviar Reporte
                </button>
            </form>
        </div>
    </main>

    <!-- Lógica de la PWA -->
    <script>
        // Variables globales para el GPS
        let currentLat = null;
        let currentLng = null;

        // 1. Obtener GPS apenas carga la app
        window.onload = () => {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        document.getElementById('gps_status').innerText = `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
                        document.getElementById('gps_status').classList.replace('text-blue-600', 'text-green-600');
                    },
                    (error) => {
                        document.getElementById('gps_status').innerText = "Denegado / Error";
                        document.getElementById('gps_status').classList.replace('text-blue-600', 'text-red-500');
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                document.getElementById('gps_status').innerText = "No soportado";
            }
        };

        // 2. Mostrar/Ocultar el motivo de bloqueo según el estado
        function toggleMotivo() {
            const estado = document.getElementById('estado').value;
            const divMotivo = document.getElementById('div_motivo');
            if (estado === 'AMARILLO' || estado === 'ROJO') {
                divMotivo.classList.remove('hidden');
            } else {
                divMotivo.classList.add('hidden');
                document.getElementById('motivo_bloqueo').value = ''; // Limpiar
            }
        }

        // 3. Enviar datos al Backend (FastAPI)
        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn_submit');
            btn.innerText = "Enviando...";
            btn.disabled = true;

            // Construir el paquete JSON (Ojo: hardcodeamos empresa 1 y tecnico 1 por ahora)
            const payload = {
                empresa_id: 1,
                tecnico_id: 1,
                faena_nombre: document.getElementById('faena_nombre').value,
                estado: document.getElementById('estado').value,
                motivo_bloqueo: document.getElementById('estado').value === 'VERDE' ? null : document.getElementById('motivo_bloqueo').value,
                notas: document.getElementById('notas').value || null,
                latitud: currentLat,
                longitud: currentLng
            };

            try {
                // Apuntamos al backend local (Uvicorn)
                const response = await fetch('http://localhost:8000/api/reportes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('✅ Reporte enviado con éxito');
                    document.getElementById('reportForm').reset();
                    toggleMotivo();
                } else {
                    const err = await response.json();
                    alert('❌ Error del servidor: ' + JSON.stringify(err));
                }
            } catch (error) {
                // Aquí es donde en el futuro meteremos la lógica de guardado Offline (IndexedDB)
                alert('⚠️ No hay conexión al servidor. (En el futuro esto se guardará offline).');
                console.error(error);
            } finally {
                btn.innerText = "Enviar Reporte";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
