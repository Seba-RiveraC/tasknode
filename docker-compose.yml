services:
  db:
    image: postgres:16-alpine
    container_name: tasknode_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasknode_user
      POSTGRES_PASSWORD: tasknode_secret_2026
      POSTGRES_DB: tasknode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasknode_user -d tasknode_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: tasknode_saas_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://tasknode_user:tasknode_secret_2026@db:5432/tasknode_db
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_CONTAINER_NAME: ${AZURE_CONTAINER_NAME:-evidencias-tasknode}
      PERMITIR_PRUEBA_SIN_GPS: ${PERMITIR_PRUEBA_SIN_GPS:-false}
      PERMITIR_PRUEBA_SIN_GEOCERCA: ${PERMITIR_PRUEBA_SIN_GEOCERCA:-false}
      TERMINAL_TRABAJADOR_PRUEBA_EMAIL: ${TERMINAL_TRABAJADOR_PRUEBA_EMAIL:-}
      PERMITIR_AUTOCOMPLETADO_DEMO: ${PERMITIR_AUTOCOMPLETADO_DEMO:-false}
      DEMO_CREDENCIALES_JSON: ${DEMO_CREDENCIALES_JSON:-}
    volumes:
      - ./frontend/static/uploads:/app/frontend/static/uploads
      - ./app:/app/app
      - ./frontend:/app/frontend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: