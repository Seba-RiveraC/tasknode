version: '3.8'

services:
  db:
    image: postgres:16
    container_name: tasknode_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: superpassword
      POSTGRES_DB: tasknode_db
    ports:
      - "5433:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tasknode_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tasknode.com
      PGADMIN_DEFAULT_PASSWORD: superpassword
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: