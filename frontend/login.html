<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNode | Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/styles.css?v=4.1">
</head>
<body class="h-full flex flex-col justify-between font-sans text-xs bg-surface-base top-accent-line">

    <!-- Cabecera Institucional -->
    <header class="h-14 bg-surface-1 border-b border-theme-dim px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-[#4f46e5] flex items-center justify-center text-white font-bold text-sm">TN</div>
            <div>
                <span class="font-bold tracking-tight text-theme-main text-base block leading-none">TaskNode</span>
                <span class="text-xs text-theme-dim">Operaciones y mantenimiento de redes de telecomunicaciones</span>
            </div>
        </div>
        <div class="flex items-center gap-2.5">
            <a href="index.html" class="px-3 py-1.5 rounded border border-theme-dim bg-surface-2 text-theme-muted hover:text-theme-main font-semibold transition">
                Conocer TaskNode
            </a>
            <button id="btn-theme-toggle" onclick="toggleTheme()" class="bg-surface-2 border border-theme-bright text-theme-main font-semibold text-xs px-3 py-1.5 rounded transition">
                Tema Oscuro
            </button>
        </div>
    </header>

    <!-- Contenedor Central de Autenticación -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-surface-1 border border-theme-dim rounded-lg shadow-xl max-w-md w-full overflow-hidden">
            
            <div class="p-6 border-b border-theme-dim bg-surface-2 flex items-center justify-between">
                <div>
                    <h1 class="text-lg font-bold text-theme-main">Ingreso a supervisión</h1>
                    <p class="text-sm text-theme-muted mt-0.5">Ingresa con tu correo y contraseña</p>
                </div>
            </div>

            <form id="form-login" onsubmit="procesarLogin(event)" class="p-6 space-y-4">
                <div id="login-error" class="hidden p-3 rounded bg-red-600/10 border border-red-600 text-red-600 font-semibold text-xs"></div>

                <div id="demo-cuentas" hidden class="bg-surface-2 border border-theme-dim rounded p-3 space-y-1.5">
                    <label for="selector-directorio" class="block text-[10px] font-mono font-bold text-theme-dim uppercase">Cuenta</label>
                    <select id="selector-directorio" class="w-full border rounded p-2 text-xs font-semibold">
                        <option value="">— Seleccionar una cuenta —</option>
                        <optgroup label="Supervisión y Control Operativo">
                            <option value="supervisor@tasknode.cl">Javier Méndez R. · Coordinador de Operaciones (Supervisor)</option>
                        </optgroup>
                        <optgroup label="Portales de clientes">
                            <option value="cliente@australconectividad.cl">Andrea Lagos · Austral Conectividad SpA</option>
                            <option value="operaciones@patagoniafibra.cl">Roberto Díaz · Patagonia Fibra Óptica Ltda.</option>
                            <option value="operaciones@surtel.cl">Camila Torres · SurTel Infraestructura SpA</option>
                        </optgroup>
                    </select>
                    <button type="button" onclick="autocompletarCuenta()" class="text-[10px] text-accent underline">Demo: autocompletar</button>
                </div>

                <div>
                    <label for="login-id" class="block text-[11px] font-bold text-theme-main uppercase mb-1">Correo electrónico</label>
                    <input type="email" id="login-id" required autocomplete="username" placeholder="nombre@empresa.cl" class="w-full border rounded p-2.5 text-xs font-medium">
                </div>

                <div>
                    <label for="login-pwd" class="block text-[11px] font-bold text-theme-main uppercase mb-1">Contraseña</label>
                    <input type="password" id="login-pwd" required autocomplete="current-password" placeholder="••••••••" class="w-full border rounded p-2.5 text-xs font-medium">
                </div>

                <button type="submit" id="btn-submit-login" class="w-full py-3 btn-primary font-bold text-xs uppercase tracking-wide rounded shadow transition">
                    Iniciar Sesión
                </button>
            </form>

            <div class="px-6 py-3 bg-surface-2 border-t border-theme-dim flex justify-between items-center text-[10px] font-mono text-theme-dim">
                <span>TASKNODE · SUPERVISIÓN</span>
                <span>REGIÓN DE LOS LAGOS · CHILE</span>
            </div>
        </div>
    </main>

    <footer class="py-3 px-6 text-center font-mono text-[10px] text-theme-dim border-t border-theme-dim bg-surface-1">
        TASKNODE CORE v3.5 · PLATAFORMA DE TRAZABILIDAD OPERACIONAL
    </footer>

    <script src="static/js/config.js?v=3.6"></script>
    <script src="static/js/login.js?v=4.2"></script>
</body>
</html>
