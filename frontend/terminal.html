<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskNode | Terminal de Terreno</title>
    <link rel="manifest" href="/app/manifest.json">
    <meta name="theme-color" content="#c2410c">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/styles.css?v=3.5">
    <style>
        .sig-canvas {
            touch-action: none;
            background-color: var(--bg-surface-2);
            cursor: crosshair;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-surface-base top-accent-line">

    <!-- Notificación Flotante -->
    <div id="hud-toast" class="fixed top-3 left-3 right-3 z-50 pointer-events-none opacity-0 translate-y-[-6px] transition-all duration-200">
        <div class="bg-surface-1 border-2 border-theme-bright shadow-xl px-4 py-2.5 rounded flex items-center gap-2.5 max-w-md mx-auto">
            <span id="toast-led" class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
            <span id="toast-msg" class="text-xs font-semibold text-theme-main">Sincronizado</span>
        </div>
    </div>

    <!-- Cabecera Móvil Limpia -->
    <header class="h-13 bg-surface-1 border-b border-theme-dim px-4 py-2.5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded bg-[#18181b] border border-amber-500/50 flex items-center justify-center text-amber-400 font-bold font-mono text-xs">TN</div>
            <div>
                <span class="font-bold text-xs text-theme-main block leading-none">Portal de Terreno</span>
                <span class="text-[10px] font-mono text-theme-dim" id="perfil-nombre">Especialista en sitio</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5 px-2 py-0.5 rounded bg-surface-2 border border-theme-dim">
                <span id="dot-red" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span id="txt-red" class="font-mono text-[9.5px] font-bold text-theme-muted">ONLINE</span>
            </div>
            <button id="btn-theme-toggle" onclick="toggleTheme()" class="bg-surface-2 border border-theme-bright text-theme-main font-semibold text-[10px] px-2 py-1 rounded">
                Tema
            </button>
            <button type="button" onclick="cerrarSesion()" class="bg-surface-2 border border-theme-bright text-theme-main font-semibold text-[10px] px-2 py-1 rounded">
                Salir
            </button>
        </div>
    </header>

    <!-- Cuerpo Principal -->
    <main class="flex-1 overflow-y-auto p-4 space-y-3 max-w-md mx-auto w-full">

        <form id="formularioEstado" class="space-y-3">
            <input type="hidden" id="operario_id" value="45">
            <input type="hidden" id="gps" value="-41.4870, -72.9550">

            <!-- BLOQUE 1: Orden Asignada -->
            <div class="bg-surface-1 border border-theme-dim rounded p-3.5 space-y-2 shadow-sm">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] font-bold text-theme-main uppercase">1. Orden de Trabajo</label>
                    <div class="flex items-center gap-2">
                        <label class="text-[10px] text-theme-dim flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" id="chk-ver-todas" onchange="poblarDropdown(listaOTsCache)">
                            <span>Todas las cuadrillas</span>
                        </label>
                        <span id="info-ot-estado" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded badge-emitida">-</span>
                    </div>
                </div>

                <select id="codigo_ot" required onchange="actualizarInfoOTSeleccionada()" class="w-full border rounded p-2 text-xs font-mono font-bold"></select>

                <div class="flex justify-between items-center text-[11px] pt-0.5">
                    <span class="font-semibold text-accent" id="info-ot-cliente">Mandante: -</span>
                    <button type="button" onclick="abrirPliegoPDFDesdeTerminal()" class="text-theme-muted underline hover:text-theme-main font-semibold">
                        Pliego A4
                    </button>
                </div>

                <div id="info-ot-descripcion" class="text-xs text-theme-muted bg-surface-2 border border-theme-dim rounded p-2 leading-relaxed">
                    Cargando alcance técnico...
                </div>
            </div>

            <!-- BLOQUE 2: Protocolo de Etapas -->
            <div class="bg-surface-1 border border-theme-dim rounded p-3.5 space-y-2 shadow-sm">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] font-bold text-theme-main uppercase">2. Pauta de Actividades</label>
                    <span id="terminal-progreso-hitos" class="font-mono text-xs font-bold text-emerald-600">0%</span>
                </div>
                <div class="w-full h-1.5 bg-surface-base rounded-sm overflow-hidden border border-theme-dim">
                    <div id="terminal-barra-hitos" class="h-full bg-emerald-600 transition-all duration-300" style="width: 0%"></div>
                </div>
                <div id="contenedor-hitos-terminal" class="space-y-1.5 pt-1"></div>
            </div>

            <!-- BLOQUE 3: Reporte, Chips Táctiles y Evidencia -->
            <div class="bg-surface-1 border border-theme-dim rounded p-3.5 space-y-3 shadow-sm">
                <div>
                    <label class="block text-[11px] font-bold text-theme-main uppercase mb-1">3. Estado Operacional (UNE-EN 13306)</label>
                    <select id="estado_nuevo" required onchange="manejarCambioEstado(this.value)" class="w-full border rounded p-2 text-xs font-bold">
                        <option value="EN EJECUCIÓN">EN EJECUCIÓN (Avance de etapas en sitio)</option>
                        <option value="EN VALIDACIÓN">EN VALIDACIÓN (Etapas listas para visado)</option>
                        <option value="DETENIDA POR ANOMALÍA">DETENIDA POR ANOMALÍA (Pausa técnica / Repuesto)</option>
                        <option value="OT COMPLETADA">OT COMPLETADA (Cierre directo con recepción)</option>
                    </select>
                </div>

                <!-- Chips Táctiles de Respuesta Rápida (Ergonomía MaintainX / SafetyCulture) -->
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-bold text-theme-muted">Minuta Técnica de Terreno</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button type="button" onclick="insertarChipMinuta('Bloqueo LOTO 0.0V verificado y EPP conforme (D.S. 594).')" class="px-2 py-1 rounded bg-surface-2 hover:bg-surface-3 border border-theme-dim text-[10px] font-semibold text-theme-main transition">
                            + LOTO 0.0V OK
                        </button>
                        <button type="button" onclick="insertarChipMinuta('Parámetros de enlace medidos dentro de norma operativa.')" class="px-2 py-1 rounded bg-surface-2 hover:bg-surface-3 border border-theme-dim text-[10px] font-semibold text-theme-main transition">
                            + Parámetros en norma
                        </button>
                        <button type="button" onclick="insertarChipMinuta('Faena pausada en espera de módulo de reemplazo desde bodega.')" class="px-2 py-1 rounded bg-surface-2 hover:bg-surface-3 border border-theme-dim text-[10px] font-semibold text-theme-main transition">
                            + Espera repuesto
                        </button>
                        <button type="button" onclick="insertarChipMinuta('Trabajo finalizado al 100% y recepcionado conforme en sitio.')" class="px-2 py-1 rounded bg-surface-2 hover:bg-surface-3 border border-theme-dim text-[10px] font-semibold text-theme-main transition">
                            + Cierre conforme
                        </button>
                    </div>
                    <textarea id="obs" rows="2" class="w-full border rounded p-2 text-xs" placeholder="Seleccione una etiqueta rápida o escriba el detalle..."></textarea>
                </div>

                <!-- Captura Óptica y Firma -->
                <div class="grid grid-cols-2 gap-2 pt-0.5">
                    <label class="border border-theme-bright rounded p-2.5 text-center bg-surface-2 cursor-pointer hover:bg-surface-3 transition flex flex-col justify-center">
                        <input type="file" id="foto" accept="image/*" capture="environment" class="hidden" onchange="actualizarNombreFoto(this)">
                        <span id="camera-label" class="text-xs font-bold text-theme-main">Fotografía en Sitio</span>
                        <span class="text-[10px] text-theme-dim mt-0.5">Validación óptica</span>
                    </label>

                    <button type="button" onclick="abrirModalFirma()" class="border border-theme-bright rounded p-2.5 text-center bg-surface-2 hover:bg-surface-3 transition flex flex-col justify-center">
                        <span class="text-xs font-bold text-theme-main">Recepción en Sitio</span>
                        <span id="badge-tipo-firma" class="text-[10px] font-mono text-theme-dim mt-0.5">Firma / Token QR</span>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnEnviar" class="w-full py-3 btn-primary font-bold text-xs uppercase tracking-wide rounded shadow transition">
                Registrar y Sincronizar Avance
            </button>
        </form>

        <!-- Pie Discreto: Al tocar el código de versión se despliega el panel de diagnóstico para la defensa -->
        <div class="pt-2 text-center">
            <button type="button" onclick="togglePanelDiagnosticoDefensa()" class="font-mono text-[10px] text-theme-dim hover:text-theme-main transition">
                TASKNODE FIELD v3.5 · <span id="badge-geocerca" class="text-emerald-600 font-bold">WGS84 EN SITIO</span>
            </button>

            <div id="panel-diagnostico-oculto" class="hidden mt-2 bg-surface-2 border border-theme-dim rounded p-2.5 flex justify-between items-center text-[10px] font-mono">
                <button type="button" id="btn-sim-gps" onclick="alternarSimulacionGPS()" class="underline font-semibold text-theme-main">
                    Conmutar Geocerca (&gt;4 km)
                </button>
                <button type="button" id="btn-toggle-net" onclick="conmutarModoRed()" class="underline font-semibold text-theme-main">
                    Cola Offline (Outbox: <span id="outbox-count">0</span>)
                </button>
            </div>
        </div>

    </main>

    <!-- MODAL DE RECEPCIÓN Y FIRMA LIMPIO -->
    <div id="modal-firma-terreno" class="fixed inset-0 bg-black/75 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-surface-1 border-2 border-theme-bright rounded-lg max-w-md w-full overflow-hidden shadow-2xl">
            <div class="px-4 py-3 border-b border-theme-dim bg-surface-2 flex justify-between items-center">
                <div>
                    <span class="font-bold text-xs uppercase text-theme-main block">Acta de Conformidad en Terreno</span>
                    <span class="text-[10px] text-theme-dim">Acreditación bajo Ley N° 19.799</span>
                </div>
                <button type="button" onclick="cerrarModalFirma()" class="px-2 py-0.5 rounded border border-theme-dim bg-surface-1 text-theme-main font-bold text-xs">Cerrar</button>
            </div>

            <div class="p-4 space-y-3">
                <div class="grid grid-cols-2 gap-2 bg-surface-2 p-2.5 rounded border border-theme-dim">
                    <div>
                        <label class="block text-[10px] font-bold text-theme-dim uppercase mb-0.5">Encargado Receptor</label>
                        <input type="text" id="nombre_encargado" value="Carlos Valenzuela M." class="w-full border rounded px-2 py-1 text-xs font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-theme-dim uppercase mb-0.5">RUT Receptor</label>
                        <input type="text" id="rut_encargado" value="14.285.631-8" class="w-full border rounded px-2 py-1 text-xs font-mono font-bold">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btn-tab-tactil" onclick="seleccionarModoFirma('TACTIL')" class="py-1.5 px-2 rounded font-bold text-xs border border-accent text-accent bg-surface-2">
                        Rúbrica Manuscrita
                    </button>
                    <button type="button" id="btn-tab-qr" onclick="seleccionarModoFirma('QR')" class="py-1.5 px-2 rounded font-bold text-xs border border-theme-dim text-theme-muted bg-surface-2">
                        Token QR Corporativo
                    </button>
                </div>

                <div id="panel-firma-tactil" class="space-y-1.5">
                    <div class="flex justify-between items-center text-[10px] text-theme-dim font-mono">
                        <span>Firme dentro del recuadro táctil:</span>
                        <div class="space-x-2">
                            <button type="button" onclick="cargarFirmaRapidaPrueba()" class="text-theme-dim hover:text-theme-main underline" title="Estampar rúbrica registrada del encargado">Estampar registrada</button>
                            <button type="button" onclick="limpiarCanvasFirma()" class="text-accent underline font-bold">Borrar</button>
                        </div>
                    </div>
                    <div class="border border-theme-bright rounded overflow-hidden">
                        <canvas id="signature-canvas" width="360" height="115" class="w-full h-28 sig-canvas"></canvas>
                    </div>
                </div>

                <div id="panel-firma-qr" class="hidden space-y-2 py-2">
                    <button type="button" id="btn-escanear-qr" onclick="simularEscaneoQR()" class="w-full py-2.5 bg-surface-2 border border-theme-bright text-theme-main font-bold text-xs rounded">
                        Verificar Token QR del Receptor
                    </button>
                    <div id="qr-resultado" class="hidden p-2 rounded bg-emerald-950/20 border border-emerald-800 text-emerald-500 font-mono text-[10px] text-center font-bold">
                        TOKEN QR VERIFICADO · CARLOS VALENZUELA (14.285.631-8)
                    </div>
                </div>
            </div>

            <div class="px-4 py-3 border-t border-theme-dim bg-surface-2 flex justify-end gap-2">
                <button type="button" onclick="limpiarCanvasFirma(); cerrarModalFirma();" class="px-3 py-1.5 rounded border border-theme-dim text-theme-muted text-xs font-semibold">Cancelar</button>
                <button type="button" onclick="cerrarModalFirma()" class="btn-primary font-bold text-xs px-4 py-1.5 rounded">Aplicar Conformidad</button>
            </div>
        </div>
    </div>

    <script src="static/js/config.js?v=3.5"></script>
    <script src="static/js/terminal.js?v=3.5"></script>
</body>
</html>
