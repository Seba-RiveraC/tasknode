<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNode | Terminal de Terreno (Técnico)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/styles.css?v=2.6">
</head>
<body class="h-full flex flex-col font-sans bg-surface-base top-accent-line">

    <!-- Notificación Superior -->
    <div id="hud-toast" class="fixed top-3 left-3 right-3 z-50 pointer-events-none opacity-0 translate-y-[-6px] transition-all duration-200">
        <div class="bg-surface-1 border-2 border-theme-bright shadow-2xl px-3.5 py-2.5 rounded flex items-center gap-2.5 max-w-md mx-auto">
            <span id="toast-led" class="w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0"></span>
            <span id="toast-msg" class="text-xs font-semibold text-theme-main">Aviso</span>
        </div>
    </div>

    <!-- Cabecera -->
    <header class="h-12 bg-surface-1 border-b border-theme-dim px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded bg-[#18181b] border border-amber-500/50 flex items-center justify-center text-amber-400 font-bold font-mono text-xs">TN</div>
            <span class="font-bold text-xs sm:text-sm text-theme-main">Terminal del Técnico en Planta</span>
        </div>
        <div class="flex items-center gap-2">
            <span id="dot-red" class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="txt-red" class="font-mono text-[11px] font-bold text-theme-muted">EN LÍNEA</span>
            <button id="btn-theme-toggle" onclick="toggleTheme()" class="ml-1 bg-surface-2 hover:bg-surface-3 border border-theme-bright text-theme-main font-semibold text-[11px] px-2.5 py-1 rounded transition flex items-center gap-1">
                <span>🌙</span>
            </button>
        </div>
    </header>

    <!-- Formulario Principal -->
    <main class="flex-1 overflow-y-auto p-3.5 space-y-3 max-w-md mx-auto w-full">

        <!-- 1. Credencial de Cuadrilla -->
        <div class="bg-surface-1 border border-theme-dim rounded p-3 shadow-sm">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded bg-surface-2 border border-theme-bright flex items-center justify-center text-accent font-mono font-bold text-xs" id="perfil-iniciales">
                        SR
                    </div>
                    <div>
                        <div class="font-bold text-xs text-theme-main" id="perfil-nombre">Sebastián Rivera</div>
                        <div class="text-[11px] text-theme-dim font-mono" id="perfil-rut-cargo">RUT: 18.421.903-K · Técnico Responsable</div>
                    </div>
                </div>
                <span class="px-2 py-0.5 rounded badge-completada text-[10px] font-bold">
                    ✓ D.S. 594 OK
                </span>
            </div>
        </div>

        <!-- 2. Ejecución de Orden -->
        <form id="formularioEstado" class="space-y-3">
            <input type="hidden" id="operario_id" value="45">
            <input type="hidden" id="gps" value="-41.4693, -72.9424">

            <div class="bg-surface-1 border border-theme-dim rounded p-3.5 space-y-2.5 shadow-sm">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-theme-main uppercase">1. Orden de Trabajo Asignada</label>
                    <span id="info-ot-estado" class="text-[11px] font-mono font-bold text-accent"></span>
                </div>

                <select id="codigo_ot" required onchange="actualizarInfoOTSeleccionada()" class="w-full border rounded p-2 text-xs font-mono font-bold"></select>

                <div id="info-ot-descripcion" class="text-xs text-theme-main bg-surface-2 border border-theme-dim rounded p-2.5 leading-relaxed">
                    Cargando instrucciones...
                </div>

                <button type="button" onclick="abrirPliegoPDFDesdeTerminal()" class="w-full bg-surface-2 hover:bg-surface-3 border border-theme-bright text-theme-main font-bold text-xs py-2 px-3 rounded flex items-center justify-center gap-1.5 transition">
                    <span>📄 Abrir Pliego Técnico de la Orden (Hoja A4 / PDF)</span>
                </button>
            </div>

            <div class="bg-surface-1 border border-theme-dim rounded p-3.5 space-y-3 shadow-sm">
                <div>
                    <label class="block text-xs font-bold text-theme-main uppercase mb-1">2. Reportar Estado de Avance</label>
                    <select id="estado_nuevo" required onchange="autocompletarNovedad()" class="w-full border rounded p-2 text-xs font-bold">
                        <option value="EN EJECUCIÓN">EN EJECUCIÓN (Iniciando tareas en máquina)</option>
                        <option value="EN VALIDACIÓN">EN VALIDACIÓN (Trabajo terminado para revisión)</option>
                        <option value="DETENIDA POR ANOMALÍA">DETENIDA POR ANOMALÍA (Falta repuesto / Problema)</option>
                        <option value="OT COMPLETADA">OT COMPLETADA (Cierre directo)</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-theme-main uppercase">3. Detalle Técnico Realizado</label>
                        <button type="button" onclick="autocompletarNovedad()" class="text-[11px] text-accent hover:underline font-bold">
                            + Insertar texto tipo
                        </button>
                    </div>
                    <textarea id="obs" rows="3" class="w-full border rounded p-2 text-xs" placeholder="Describa las tareas ejecutadas, bloqueo LOTO y lecturas..."></textarea>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-theme-main uppercase">4. Fotografía de Respaldo</label>
                        <span class="text-[10px] font-mono text-theme-dim">Filtro Laplaciano &ge; 100</span>
                    </div>
                    <label class="block border border-dashed border-theme-bright rounded p-3 text-center bg-surface-2 cursor-pointer hover:bg-surface-3 transition">
                        <input type="file" id="foto" accept="image/*" class="hidden" onchange="actualizarNombreFoto(this)">
                        <div id="camera-label" class="text-xs text-theme-muted font-semibold">
                            📷 Adjuntar fotografía de inspección
                        </div>
                    </label>
                </div>
            </div>

            <button type="submit" id="btnEnviar" class="w-full py-3 btn-primary font-bold text-xs uppercase tracking-wide rounded shadow-md transition">
                Firmar y Enviar Avance (SHA-256)
            </button>
        </form>

        <!-- Barra Discreta de Pruebas de Ingeniería -->
        <div class="bg-surface-2 border border-theme-dim rounded p-3 text-[11px] space-y-1.5">
            <div class="flex items-center justify-between">
                <span class="font-bold text-theme-muted">Posición GPS respecto al Equipo:</span>
                <span id="badge-geocerca" class="font-mono font-bold text-emerald-600">✓ En Planta (-41.4693, -72.9424)</span>
            </div>
            <div class="flex items-center justify-between pt-1 border-t border-theme-dim text-[10px] text-theme-dim">
                <span>Simulación para defensa:</span>
                <div class="flex gap-2 font-semibold">
                    <button type="button" id="btn-sim-gps" onclick="alternarSimulacionGPS()" class="underline hover:text-theme-main">
                        Simular GPS lejos (&gt;4km)
                    </button>
                    <span>·</span>
                    <button type="button" id="btn-toggle-net" onclick="conmutarModoRed()" class="underline hover:text-theme-main">
                        Modo sin red (Cola: <span id="outbox-count">0</span>)
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script src="static/js/config.js?v=2.6"></script>
    <script src="static/js/terminal.js?v=2.6"></script>
</body>
</html>
